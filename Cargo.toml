[workspace]
resolver = "2"
members = ["crates/lgx-caps", "crates/lgx-proto", "crates/lgx-server", "crates/lgx-client", "crates/lgx-server-macos", "tests"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/B612S/lgx"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
