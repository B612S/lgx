[package]
name = "lgx-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "lgx server: zero-copy HEVC streaming of a wlroots session"

[dependencies]
ring = "0.17"
wl-clipboard-rs = "0.9.5"
lgx-proto = { path = "../lgx-proto" }
lgx-caps = { path = "../lgx-caps" }
libc = "0.2"
memmap2 = "0.9"
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
bitflags = "2"
pipewire = { version = "0.10", features = ["v0_3_49"] }
ashpd = { version = "0.14.3", default-features = false, features = ["screencast", "async-io"] }
futures-lite = "2"
ringbuf = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
flacenc = "0.5.1"

[dev-dependencies]
claxon = "0.4.3"
